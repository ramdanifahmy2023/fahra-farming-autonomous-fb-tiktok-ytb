name: Periksa rencana

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ambil dokumen
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Siapkan Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Periksa file, tautan, dan pola rahasia
        run: python scripts/verify_plan.py --output runtime/verification/ci.json
      - name: Simpan bukti pemeriksaan dokumen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: planning-verification
          path: runtime/verification/ci.json
          retention-days: 14
          if-no-files-found: ignore
